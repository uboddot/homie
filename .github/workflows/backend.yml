# Tests the backend on every PR that touches it; on main also builds and pushes ghcr.io/<owner>/homie-backend.
# The paths filter is what keeps a frontend-only change from rebuilding the backend image and vice versa.
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
      # Testcontainers starts Postgres on the runner's Docker
      - run: ./mvnw -B verify

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homie-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # Railway doesn't notice a new :latest on its own. Optional: add a Railway project token as the
      # RAILWAY_TOKEN secret (and RAILWAY_SERVICE_BACKEND as a variable if the service isn't named "backend").
      - name: Redeploy on Railway
        if: env.RAILWAY_TOKEN != ''
        run: npx -y @railway/cli redeploy --service "${{ vars.RAILWAY_SERVICE_BACKEND || 'backend' }}" --yes

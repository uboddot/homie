services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: homie-backend
    container_name: homie-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml # dependency changes only need a container restart
      - homie-m2:/root/.m2 # Maven + dependencies, kept across container recreates
      - homie-backend-target:/app/target # compiled classes, so restarts compile incrementally
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - MAVEN_ARGS=--no-transfer-progress # without a TTY the download progress floods the log
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MAIL_HOST=mailpit
      - PGHOST=postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  # dev DB, kept in the homie-pg-data volume. Reset: docker compose -f docker-compose.dev.yml down -v
  postgres:
    image: postgres:17-alpine
    container_name: homie-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=homie
      - POSTGRES_PASSWORD=homie
      - POSTGRES_DB=homie
    volumes:
      - homie-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homie"]
      interval: 5s
      timeout: 5s
      retries: 10

  # fake SMTP server: catches every mail the backend sends, inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: homie-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: homie-frontend
    container_name: homie-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080 # called from the browser, not from the container
      - CHOKIDAR_USEPOLLING=true
    depends_on: [backend]

volumes:
  homie-pg-data:
  homie-m2:
  homie-backend-target:
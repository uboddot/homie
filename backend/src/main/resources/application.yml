spring:
  application:
    name: homie-backend
  datasource:
    url: jdbc:h2:file:/tmp/homiedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  h2:
    console:
      enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  # used to build the link in the verification mail
  frontend-url: ${FRONTEND_URL}
  mail-from: ${MAIL_FROM:no-reply@homie.local}
  verification-token-hours: 24

jwt:
  # base64-encoded, at least 256 bit. Required outside the dev profile.
  secret: ${JWT_SECRET}
  expiration-minutes: 60
  cookie-name: access_token
  cookie-secure: true

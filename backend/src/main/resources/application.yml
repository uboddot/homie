spring:
  application:
    name: homie-backend
  datasource:
    url: jdbc:h2:file:/tmp/homiedb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  h2:
    console:
      enabled: false

jwt:
  # base64-encoded, at least 256 bit. Required outside the dev profile.
  secret: ${JWT_SECRET}
  expiration-minutes: 60
  cookie-name: access_token
  cookie-secure: true

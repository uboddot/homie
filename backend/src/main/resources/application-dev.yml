# Local development: activate with SPRING_PROFILES_ACTIVE=dev
# or ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Also enables the Seeder (dev users + sample recipes).
spring:
  # Postgres from docker-compose.dev.yml (or: docker run -p 5432:5432 -e POSTGRES_USER=homie -e POSTGRES_PASSWORD=homie postgres:17-alpine)
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:homie}
    username: ${PGUSER:homie}
    password: ${PGPASSWORD:homie}
  # Mailpit catches all mails, inbox at http://localhost:8025
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:lWw8IkAmFS06uIMdppjQ6rbFK0gbSKA0iUshwdD03Zg=}
  cookie-secure: false # no HTTPS on localhost
